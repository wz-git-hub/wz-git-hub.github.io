<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 2479 844" width="2479" height="844">
  <defs>
    <linearGradient id="dyBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbd4e6"/>
      <stop offset=".45" stop-color="#e6ddf9"/>
      <stop offset="1" stop-color="#cceffb"/>
    </linearGradient>
    <linearGradient id="dyScr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f45"/>
      <stop offset="1" stop-color="#16181f"/>
    </linearGradient>
    <linearGradient id="dyPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5a7d"/>
      <stop offset="1" stop-color="#fe2c55"/>
    </linearGradient>
    <linearGradient id="dyCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#25f4ee"/>
      <stop offset="1" stop-color="#35c9e8"/>
    </linearGradient>
    <g id="dyHeart">
      <path d="M0 7.4C-6.3 2.6-10.4-.6-10.4-4.6c0-3 2.3-5.3 5.2-5.3 2 0 3.8 1.1 5.2 3 1.4-1.9 3.2-3 5.2-3 2.9 0 5.2 2.3 5.2 5.3 0 4-4.1 7.2-10.4 12z"/>
    </g>
    <g id="dyPlay"><path d="M0-13 18 0 0 13z"/></g>
    <g id="dyNote">
      <path d="M6-26v38c0 1.2-.4 2.2-1.3 3-1 .8-2.2 1.2-3.7 1.2-1.6 0-3-.5-4.2-1.5-1.2-1-1.8-2.2-1.8-3.6 0-1.5.6-2.7 1.8-3.7 1.2-1 2.6-1.5 4.2-1.5.7 0 1.4.1 2 .3V-18l14-4v18c0 1.2-.4 2.2-1.3 3-1 .8-2.2 1.2-3.7 1.2-1.6 0-3-.5-4.2-1.5-1.2-1-1.8-2.2-1.8-3.6 0-1.5.6-2.7 1.8-3.7 1.2-1 2.6-1.5 4.2-1.5.7 0 1.4.1 2 .3z"/>
    </g>
    <g id="dyCam">
      <rect x="-34" y="-22" width="68" height="44" rx="10"/>
      <path d="M-4-22 4-32h16l8 10z"/>
      <circle cx="0" cy="0" r="12" fill="#fff"/>
    </g>
    <g id="dyFlame">
      <path d="M0-30c8 10 14 17 14 25 0 9.4-6.3 16-14 16S-14 4.4-14-5c0-8 6-15 14-25z"/>
      <path d="M0-6c3 4 5 6.6 5 9.4C5 7 2.8 9.6 0 9.6S-5 7-5 3.4C-5 .6-3-2 0-6z" fill="#fff"/>
    </g>
    <g id="dyWave">
      <rect x="0" y="-8" width="6" height="16" rx="3"/>
      <rect x="12" y="-18" width="6" height="36" rx="3"/>
      <rect x="24" y="-12" width="6" height="24" rx="3"/>
      <rect x="36" y="-24" width="6" height="48" rx="3"/>
      <rect x="48" y="-14" width="6" height="28" rx="3"/>
    </g>
  </defs>

  <rect width="2479" height="844" fill="url(#dyBg)"/>

  <g opacity=".55" fill="#fff">
    <circle cx="330" cy="150" r="118"/>
    <circle cx="2150" cy="700" r="150"/>
    <circle cx="1240" cy="120" r="70"/>
    <circle cx="1880" cy="160" r="46"/>
    <circle cx="560" cy="720" r="64"/>
  </g>
  <g opacity=".28">
    <circle cx="1640" cy="300" r="190" fill="#fe2c55"/>
    <circle cx="880" cy="640" r="160" fill="#25f4ee"/>
    <circle cx="2280" cy="240" r="120" fill="#a78bfa"/>
  </g>

  <g stroke="#16181f" stroke-opacity=".10" fill="none" stroke-width="3">
    <path d="M0 300c220 60 380-40 560 20s300 90 520 40"/>
    <path d="M1400 800c260-70 420 30 700-30"/>
  </g>

  <!-- 左：手机 + 短视频卡片 -->
  <g transform="translate(360 430)">
    <rect x="-150" y="-250" width="300" height="500" rx="46" fill="url(#dyScr)" transform="rotate(-6)"/>
    <rect x="-150" y="-250" width="300" height="500" rx="46" fill="none" stroke="#25f4ee" stroke-opacity=".85" stroke-width="7" transform="rotate(-6)"/>
    <g transform="rotate(-6)">
      <rect x="-126" y="-212" width="252" height="424" rx="30" fill="#fff" fill-opacity=".10"/>
      <use href="#dyPlay" fill="#fff" transform="translate(-4 0) scale(2.1)"/>
      <g fill="#fff" fill-opacity=".55">
        <rect x="-100" y="120" width="150" height="9" rx="4.5"/>
        <rect x="-100" y="142" width="96" height="9" rx="4.5"/>
      </g>
      <g transform="translate(78 168)">
        <use href="#dyHeart" fill="#fe2c55" transform="scale(1.5)"/>
      </g>
    </g>
    <g transform="translate(298 -300) rotate(9)">
      <rect x="-84" y="-116" width="168" height="232" rx="20" fill="#fff" fill-opacity=".92"/>
      <rect x="-84" y="-116" width="168" height="232" rx="20" fill="none" stroke="#16181f" stroke-opacity=".10" stroke-width="3"/>
      <use href="#dyPlay" fill="url(#dyCyan)" transform="translate(-6 6) scale(1.15)"/>
      <g fill="#16181f" fill-opacity=".16">
        <rect x="-56" y="62" width="112" height="8" rx="4"/>
        <rect x="-56" y="80" width="66" height="8" rx="4"/>
      </g>
    </g>
  </g>

  <!-- 中：音符 / 声波 -->
  <g transform="translate(1180 700)" fill="#16181f" fill-opacity=".18">
    <use href="#dyNote" transform="translate(-260 0) scale(1.5)"/>
    <use href="#dyNote" transform="translate(230 -20) scale(1.1)"/>
  </g>
  <g transform="translate(1090 190)" fill="#fe2c55" fill-opacity=".5">
    <use href="#dyWave"/>
  </g>

  <!-- 右：电影胶片 + 相机 + 火苗 -->
  <g transform="translate(1980 430)">
    <g transform="rotate(8)">
      <rect x="-260" y="-120" width="520" height="240" rx="18" fill="#16181f" fill-opacity=".82"/>
      <g fill="#fff" fill-opacity=".92">
        <rect x="-236" y="-104" width="472" height="208" rx="10" fill="#fff" fill-opacity=".14"/>
        <rect x="-212" y="-88" width="130" height="176" rx="8" fill="url(#dyPink)" fill-opacity=".85"/>
        <rect x="-62" y="-88" width="130" height="176" rx="8" fill="#25f4ee" fill-opacity=".75"/>
        <rect x="88" y="-88" width="130" height="176" rx="8" fill="#fff" fill-opacity=".22"/>
      </g>
      <g fill="#fff" fill-opacity=".9">
        <rect x="-252" y="-70" width="14" height="26" rx="5"/>
        <rect x="-252" y="-18" width="14" height="26" rx="5"/>
        <rect x="-252" y="34" width="14" height="26" rx="5"/>
        <rect x="238" y="-70" width="14" height="26" rx="5"/>
        <rect x="238" y="-18" width="14" height="26" rx="5"/>
        <rect x="238" y="34" width="14" height="26" rx="5"/>
      </g>
    </g>
    <g transform="translate(300 -190)">
      <use href="#dyCam" fill="#16181f" fill-opacity=".8" transform="scale(1.25)"/>
    </g>
    <g transform="translate(240 230)">
      <use href="#dyFlame" fill="url(#dyPink)" transform="scale(1.3)"/>
    </g>
  </g>

  <!-- 散落的小元素 -->
  <g fill="#fe2c55" fill-opacity=".45">
    <use href="#dyHeart" transform="translate(760 180) scale(1.6)"/>
    <use href="#dyHeart" transform="translate(2320 620) scale(1.25)"/>
    <use href="#dyHeart" transform="translate(1640 760) scale(1)"/>
  </g>
  <g fill="#25f4ee" fill-opacity=".55">
    <use href="#dyPlay" transform="translate(1460 250) scale(1.35)"/>
    <use href="#dyPlay" transform="translate(700 560) scale(.95)"/>
    <use href="#dyPlay" transform="translate(2210 120) scale(1.1)"/>
  </g>
  <g fill="#a78bfa" fill-opacity=".5">
    <use href="#dyNote" transform="translate(2060 740) scale(1.2)"/>
  </g>
  <g fill="#16181f" fill-opacity=".16">
    <circle cx="1250" cy="470" r="9"/>
    <circle cx="1290" cy="470" r="9"/>
    <circle cx="1330" cy="470" r="9"/>
    <circle cx="430" cy="120" r="7"/>
    <circle cx="1700" cy="540" r="8"/>
    <circle cx="980" cy="740" r="7"/>
  </g>
</svg>
