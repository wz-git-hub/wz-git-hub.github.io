<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>头条资讯 | Forever BLog</title>
<meta name="description" content="实时新闻资讯 —— 热榜 / 频道 / 按日期翻历史，由本机新闻服务经 Cloudflare 隧道提供。">
<link rel="icon" href="/img/favicon.png">
<style>
:root{
  --accent:#D50030;
  --accent2:#ff3b5c;
  --radius:12px;
  --maxw:1240px;
}
html[data-theme="dark"]{
  --bg:#0d0d0d; --bg2:#121212; --card:#15171b; --card2:#1c1f24;
  --border:rgba(255,255,255,.09); --border2:rgba(255,255,255,.18);
  --text:#e6e8eb; --dim:#8b929c; --dim2:#6b7280;
  --head:rgba(13,13,13,.80); --shadow:0 12px 28px rgba(0,0,0,.55);
  --accent-text:#ff5c78;
  --chipbg:rgba(255,255,255,.05);
  --ph:linear-gradient(135deg,#1e2126,#2a2e35);
}
html[data-theme="light"]{
  --bg:#f5f6f8; --bg2:#fff; --card:#fff; --card2:#f0f2f5;
  --border:rgba(0,0,0,.09); --border2:rgba(0,0,0,.2);
  --text:#22272e; --dim:#6b7280; --dim2:#9aa0a6;
  --head:rgba(255,255,255,.85); --shadow:0 12px 28px rgba(15,23,42,.14);
  --accent-text:#c30029;
  --chipbg:rgba(0,0,0,.04);
  --ph:linear-gradient(135deg,#e8eaee,#d7dbe1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
a{color:var(--accent-text);text-decoration:none}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
::selection{background:var(--accent);color:#fff}

/* ---------- header ---------- */
.top{
  position:sticky;top:0;z-index:60;
  background:var(--head);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
.topin{max-width:var(--maxw);margin:0 auto;padding:10px 20px}
.row1{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{
  width:34px;height:34px;border-radius:9px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--accent),#8d0020);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:15px;letter-spacing:.5px;
}
.brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
.brand .sub{font-size:11.5px;color:var(--dim);white-space:nowrap}
.spacer{flex:1 1 auto}
.stats{font-size:12px;color:var(--dim);white-space:nowrap}
.stats b{color:var(--accent-text);font-weight:700;font-size:13px}
.back{
  display:inline-flex;align-items:center;gap:5px;
  padding:6px 12px;border-radius:999px;border:1px solid var(--border);
  background:var(--chipbg);font-size:12.5px;color:var(--text);
  transition:.15s;white-space:nowrap;
}
.back:hover{border-color:var(--accent);color:var(--accent-text)}
.readnow{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 13px;border-radius:999px;
  background:linear-gradient(135deg,var(--accent),#8d0020);
  border:1px solid var(--accent);color:#fff;font-weight:600;font-size:12.5px;
  transition:.15s;white-space:nowrap;
}
.readnow:hover{filter:brightness(1.1);color:#fff}
.readnow .dot{width:6px;height:6px;border-radius:50%;background:#7dffb0;box-shadow:0 0 6px #7dffb0;flex:0 0 auto}
.iconbtn{
  width:32px;height:32px;border-radius:9px;border:1px solid var(--border);
  background:var(--chipbg);cursor:pointer;display:flex;align-items:center;
  justify-content:center;transition:.15s;flex:0 0 auto;
}
.iconbtn:hover{border-color:var(--accent);color:var(--accent-text)}
.iconbtn.spin svg{animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.row2{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.search{position:relative;flex:1 1 220px;min-width:180px;max-width:360px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.5;pointer-events:none}
.search input{
  width:100%;padding:8px 34px 8px 34px;border-radius:999px;
  border:1px solid var(--border);background:var(--chipbg);outline:none;transition:.15s;
}
.search input:focus{border-color:var(--accent);background:var(--bg2)}
.search .clr{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:22px;height:22px;border:0;border-radius:50%;background:transparent;
  cursor:pointer;color:var(--dim);display:none;line-height:1;
}
.search .clr:hover{background:var(--card2);color:var(--text)}
.search.hasval .clr{display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap;max-width:100%}
.chip{
  padding:5px 12px;border-radius:999px;border:1px solid var(--border);
  background:var(--chipbg);cursor:pointer;font-size:12.5px;
  transition:.15s;white-space:nowrap;
}
.chip:hover{border-color:var(--border2)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
select.sel{
  padding:6px 10px;border-radius:9px;border:1px solid var(--border);
  background:var(--chipbg);cursor:pointer;outline:none;font-size:12.5px;
}
select.sel:focus{border-color:var(--accent)}

/* ---------- status ---------- */
main{max-width:var(--maxw);margin:0 auto;padding:18px 20px 60px}
.status{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  font-size:12.5px;color:var(--dim);
  padding:8px 12px;margin-bottom:14px;
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
}
.status .dot{width:7px;height:7px;border-radius:50%;background:#22c55e;flex:none}
.status .dot.off{background:var(--accent)}
.status .sp{flex:1}
.status code{font-size:11.5px;opacity:.8}

/* ---------- 热榜 ---------- */
.secttl{
  display:flex;align-items:center;gap:8px;
  font-size:14px;font-weight:700;margin:4px 0 10px;
}
.secttl .bar{width:3px;height:15px;border-radius:2px;background:var(--accent);display:inline-block}
.hotstrip{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));
  gap:10px;margin-bottom:22px;
}
.hot{
  display:flex;align-items:center;gap:10px;
  padding:9px 11px;border-radius:10px;cursor:pointer;
  background:var(--card);border:1px solid var(--border);
  transition:.15s;overflow:hidden;
}
.hot:hover{border-color:var(--accent);transform:translateY(-2px)}
.hot .rk{
  flex:0 0 auto;width:20px;height:20px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-size:11.5px;font-weight:700;color:#fff;background:var(--dim2);
}
.hot .rk.top{background:var(--accent)}
.hot .rk.t2{background:#ff6b35}
.hot .rk.t3{background:#f7b32b}
.hot .ht{
  flex:1 1 auto;min-width:0;font-size:12.8px;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.hot .hv{flex:0 0 auto;font-size:11px;color:var(--redhot);color:var(--accent-text);white-space:nowrap}

/* ---------- 信息流 ---------- */
#feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.card{
  display:flex;gap:12px;align-items:flex-start;
  padding:12px;border-radius:var(--radius);cursor:pointer;
  background:var(--card);border:1px solid var(--border);
  transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;
}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--accent)}
.card .body{flex:1 1 auto;min-width:0}
.card .ttl{
  font-size:14px;font-weight:600;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.card .abs{
  font-size:12.2px;color:var(--dim);line-height:1.6;margin-top:5px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.card .meta{font-size:11.5px;color:var(--dim2);margin-top:7px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .meta .tag{
  display:inline-block;padding:1px 6px;border-radius:5px;margin-right:5px;
  font-size:10.5px;font-weight:700;color:#fff;background:var(--accent);
}
.card .meta .tag.v{background:#1f6feb}
.card .thumb{
  flex:0 0 auto;width:96px;height:66px;border-radius:8px;overflow:hidden;
  background:var(--ph);position:relative;
}
.card .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.card .thumb .noimg{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:19px;font-weight:700;color:#fff;letter-spacing:1px;
}

.morebar{text-align:center;padding:22px 0 10px}
.morebar button{
  padding:8px 22px;border-radius:999px;border:1px solid var(--border);
  background:var(--chipbg);cursor:pointer;font-size:13px;transition:.15s;
}
.morebar button:hover{border-color:var(--accent);color:var(--accent-text)}
.done{text-align:center;color:var(--dim2);padding:22px 0;font-size:12.5px}
.empty{text-align:center;padding:70px 20px;color:var(--dim);display:none}
.empty .big{font-size:42px;opacity:.35;margin-bottom:10px}

.note{
  margin-top:26px;padding:12px 15px;border-radius:var(--radius);
  background:var(--card);border:1px solid var(--border);
  font-size:12px;color:var(--dim);line-height:1.75;
}
.note code{font-size:11.5px}

@media (max-width:760px){
  .topin{padding:8px 12px}
  main{padding:12px 12px 46px}
  .brand .sub,.stats{display:none}
  #feed{grid-template-columns:1fr}
  .hotstrip{grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
  .card .thumb{width:82px;height:58px}
  .status{padding:7px 10px;margin-bottom:10px;font-size:12px}
  .secttl{margin:2px 0 8px}

  /* 头部紧凑化：搜索框与日期选择同排，频道 chips 单行横向滑动。
     原布局在手机上会折成 7 行（chips 占 4 行），sticky 头部近半屏，
     热榜被压在下面并从头部的半透明底透出来 —— 即“浮在上方”。 */
  .top{
    position:-webkit-sticky;position:sticky;
    background:var(--bg);            /* 手机端改为不透明，杜绝内容透出 */
  }
  .row1{gap:8px}
  .row2{gap:8px;margin-top:8px}
  .row2 .spacer{display:none}
  .search{order:1;flex:1 1 130px;min-width:0;max-width:100%}
  select.sel{order:2;flex:0 0 auto;max-width:44%}
  .chips{
    order:3;flex:1 1 100%;
    flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;padding-bottom:2px;
  }
  .chips::-webkit-scrollbar{display:none}
  .chip{padding:5px 10px;font-size:12px}
}
@media (max-width:480px){
  .hotstrip{grid-template-columns:1fr}
  .hot{padding:9px 10px;gap:9px}
  .hot .ht{font-size:13px}
  .card .ttl{font-size:13.5px}
  .card .abs{-webkit-line-clamp:2}
  main{padding:10px 10px 44px}
}
</style>
</head>
<body>

<header class="top">
  <div class="topin">
    <div class="row1">
      <div class="brand">
        <div class="logo">讯</div>
        <div>
          <h1>头条资讯</h1>
          <div class="sub">Forever BLog · 实时新闻</div>
        </div>
      </div>
      <div class="spacer"></div>
      <div class="stats" id="stats">加载中…</div>
      <a class="back" href="/">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        返回博客
      </a>
      <button class="iconbtn" id="reloadBtn" title="刷新" aria-label="刷新">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
      </button>
      <button class="iconbtn" id="themeBtn" title="切换主题" aria-label="切换主题">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      </button>
    </div>

    <div class="row2">
      <div class="search" id="searchWrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="搜索新闻标题…（按 / 聚焦）" autocomplete="off">
        <button class="clr" id="clrBtn" aria-label="清空">✕</button>
      </div>
      <div class="chips" id="chips"></div>
      <div class="spacer"></div>
      <select class="sel" id="dateSel" title="按收录日期翻历史">
        <option value="">⚡ 实时最新</option>
      </select>
    </div>
  </div>
</header>

<main>
  <div class="status" id="status">
    <span class="dot" id="dot"></span>
    <span id="statusText">正在连接新闻服务…</span>
    <span class="sp"></span>
    <code id="srcHint"></code>
  </div>

  <div id="hotWrap" style="display:none">
    <div class="secttl"><span class="bar"></span>实时热榜</div>
    <div class="hotstrip" id="hotstrip"></div>
  </div>

  <div class="secttl"><span class="bar"></span><span id="feedTitle">最新资讯</span></div>
  <div id="feed"></div>

  <div class="morebar" id="morebar" style="display:none">
    <button id="moreBtn">加载更多</button>
  </div>
  <div class="done" id="done" style="display:none"></div>

  <div class="empty" id="empty">
    <div class="big">📰</div>
    <div>没有匹配的新闻</div>
  </div>

  <div class="note">
    📰 本页是<b>资讯快照</b>（热榜 + 信息流 + 搜索 + 按日期翻历史），数据由本机新闻服务
    （<code>E:\news_hub</code>）每日抓取后固化为静态 JSON，<b>随博客一起部署</b>，
    因此不受本地网络与出口影响。点标题跳原文。
  </div>
</main>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };

  /* ---------- 数据来源：静态快照 ----------
     2026-10-13 起本页不再依赖本机服务 / Cloudflare 隧道：
     本机出口把隧道边缘端口 7844（UDP+TCP）封了，隧道拿不回公网入口，
     遂改为构建时抓一份快照（tools/news/build_news.py）随博客一起部署。
     静态托管天然公网可达，也不受任何出口封锁影响。 */
  var DATA = null;        // news.json 全文
  var ARCH = {};          // 日期 -> 该日条目（点日期时才按需加载）

  function loadJson(url){
    return fetch(url, { cache: "no-store" }).then(function(r){
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }

  /* ---------- theme：优先跟随博客(localStorage.theme)，否则跟随系统 ---------- */
  function pickTheme(){
    var t = null;
    try { t = localStorage.getItem("theme"); } catch(e){}
    if (t !== "dark" && t !== "light"){
      t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
    }
    document.documentElement.setAttribute("data-theme", t);
  }
  pickTheme();
  $("themeBtn").addEventListener("click", function(){
    var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("theme", next); } catch(e){}
  });

  /* ---------- 工具 ---------- */
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function ago(ts){
    ts = parseInt(ts, 10) || 0;
    if (!ts) return "";
    var d = Math.floor(Date.now()/1000) - ts;
    if (d < 60) return "刚刚";
    if (d < 3600) return Math.floor(d/60) + " 分钟前";
    if (d < 86400) return Math.floor(d/3600) + " 小时前";
    if (d < 86400*7) return Math.floor(d/86400) + " 天前";
    var dt = new Date(ts*1000);
    return (dt.getMonth()+1) + "月" + dt.getDate() + "日";
  }
  function hotLabel(v){
    v = parseInt(v, 10) || 0;
    if (!v) return "";
    if (v >= 10000) return (v/10000).toFixed(1) + " 万热度";
    return v + " 热度";
  }
  var SRC_COLORS = ["#D50030","#e0632f","#c9a227","#2f9e63","#2d7ff9","#7a5cff","#c0399f","#0f8b8d"];
  function srcColor(s){
    s = String(s || "?");
    var h = 0;
    for (var i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) % 997;
    return SRC_COLORS[h % SRC_COLORS.length];
  }
  var WD = ["周日","周一","周二","周三","周四","周五","周六"];
  function weekdayOf(dstr){
    var p = String(dstr).split("-");
    if (p.length !== 3) return "";
    var d = new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10));
    return WD[d.getDay()] || "";
  }
  function dayLabel(dstr, today){
    var md = dstr.slice(5);
    if (dstr === today) return "今天 " + md;
    var y = new Date(); y.setDate(y.getDate() - 1);
    var ys = y.getFullYear() + "-" + String(y.getMonth()+1).padStart(2,"0") + "-" + String(y.getDate()).padStart(2,"0");
    if (dstr === ys) return "昨天 " + md;
    return md + " " + weekdayOf(dstr);
  }
  /* ---------- 渲染 ---------- */
  /* 静态快照没有站内阅读页，点标题直接跳原文 */
  function openArticle(item){
    var u = (item && item.origin_url) || "";
    if (u) window.open(u, "_blank", "noopener");
  }

  function hotHTML(it, i){
    var rk = i + 1;
    var cls = rk === 1 ? "top" : (rk === 2 ? "t2" : (rk === 3 ? "t3" : ""));
    /* 热榜行来自 hot_snapshot，item_id 可能为空 —— 兼容 cluster_id，并保留原文链接兜底 */
    var id = it.item_id || it.cluster_id || "";
    return '<article class="hot" data-id="' + esc(id) + '" data-orig="' + esc(it.origin_url || "") +
      '" title="' + esc(it.title) + '">' +
      '<span class="rk ' + cls + '">' + rk + '</span>' +
      '<span class="ht">' + esc(it.title) + '</span>' +
      '<span class="hv">' + esc(hotLabel(it.hot_value)) + '</span>' +
    '</article>';
  }

  function cardHTML(it){
    // 快照不带封面：源站图片有防盗链（直链 403），统一用「来源首字 + 色块」占位
    var ch = (it.source || "头条").slice(0, 1);
    var thumb = '<div class="thumb"><div class="noimg" style="background:' + srcColor(it.source) + '">' +
                esc(ch) + '</div></div>';
    var meta = [];
    if (it.best_rank > 0 && it.best_rank <= 10) meta.push('<span class="tag">热榜 ' + it.best_rank + '</span>');
    if (it.is_video) meta.push('<span class="tag v">视频</span>');
    var plain = [
      it.source ? esc(it.source) : "头条",
      ago(it.item_time || it.first_seen),
      it.comments_count ? it.comments_count + " 评论" : ""
    ].filter(Boolean).join(" · ");
    return '<article class="card" data-id="' + esc(it.item_id || "") +
      '" data-orig="' + esc(it.origin_url || "") + '">' +
      '<div class="body">' +
        '<div class="ttl">' + esc(it.title) + '</div>' +
        (it.abstract ? '<div class="abs">' + esc(it.abstract) + '</div>' : '') +
        '<div class="meta">' + meta.join("") + plain + '</div>' +
      '</div>' + thumb +
    '</article>';
  }

  /* ---------- 状态 ---------- */
  var state = { cat: "", date: "", q: "", page: 1, limit: 30, total: 0, shown: 0 };

  function setStatus(txt, off){
    $("statusText").textContent = txt;
    $("dot").className = "dot" + (off ? " off" : "");
  }

  /* ---------- 频道 chips ----------
     注意：快照只保留几百条，而服务端 /api/channels 的 count 是**全量**统计
     （如「热点 447」）。两者口径不一致，直接照搬会出现「房产 7」点进去 0 条
     的困惑。这里按快照内实际条数重新统计，保证 chip 数字与点开后的条数一致。 */
  function catLabel(cat){
    var list = DATA.channels || [];
    for (var i=0;i<list.length;i++){
      if (list[i].cat === cat) return list[i].label || cat;
    }
    return cat;
  }
  function renderChannels(){
    var list = (DATA.channels || []);
    var feed = DATA.feed || [];
    var cnt = {};
    feed.forEach(function(x){
      if (x.category) cnt[x.category] = (cnt[x.category] || 0) + 1;
    });
    var html = '<button class="chip on" data-c="">全部 ' + feed.length + '</button>';
    list.forEach(function(c){
      html += '<button class="chip" data-c="' + esc(c.cat) + '">' +
              esc(c.label) + ' ' + (cnt[c.cat] || 0) + '</button>';
    });
    var box = $("chips");
    box.innerHTML = html;
    box.onclick = function(e){
      var b = e.target.closest ? e.target.closest(".chip") : null;
      if (!b) return;
      var all = box.querySelectorAll(".chip");
      for (var i=0;i<all.length;i++) all[i].classList.remove("on");
      b.classList.add("on");
      state.cat = b.getAttribute("data-c");
      reload();
    };
  }

  /* ---------- 日期归档 ---------- */
  function renderDays(){
    var days = DATA.days || [];
    var sel = $("dateSel");
    var html = '<option value="">⚡ 最新快照</option>';
    days.forEach(function(x){
      html += '<option value="' + esc(x.date) + '">' + esc(dayLabel(x.date, DATA.today)) +
              '（' + x.count + ' 条）</option>';
    });
    sel.innerHTML = html;
    sel.onchange = function(){ state.date = sel.value; reload(); };
  }

  /* ---------- 热榜 ---------- */
  function renderHot(){
    var all = (DATA.hot && DATA.hot.items) || [];
    var items = all.slice(0, 10);
    if (!items.length){ $("hotWrap").style.display = "none"; return; }
    $("hotstrip").innerHTML = items.map(hotHTML).join("");
    $("hotWrap").style.display = "";
    var ts = DATA.hot && DATA.hot.ts ? new Date(DATA.hot.ts*1000) : null;
    if (ts) $("stats").innerHTML = '热榜 <b>' + all.length + '</b> 条 · ' +
      String(ts.getHours()).padStart(2,"0") + ":" + String(ts.getMinutes()).padStart(2,"0") + " 更新";
  }

  /* ---------- 信息流：筛选 / 搜索 / 分页全部在本地完成 ---------- */
  function currentItems(){
    if (state.date) return ARCH[state.date] || [];
    return DATA.feed || [];
  }
  function filteredItems(){
    var arr = currentItems();
    if (state.cat){
      arr = arr.filter(function(x){ return x.category === state.cat; });
    }
    if (state.q){
      var q = state.q.toLowerCase();
      arr = arr.filter(function(x){
        return ((x.title || "") + " " + (x.abstract || "") + " " + (x.source || ""))
                 .toLowerCase().indexOf(q) >= 0;
      });
    }
    return arr;
  }

  function renderFeed(append){
    var items = filteredItems();
    state.total = items.length;
    state.page = append ? state.page + 1 : 1;
    var slice = items.slice(0, state.page * state.limit);

    $("feed").innerHTML = slice.map(cardHTML).join("");
    state.shown = slice.length;
    $("empty").style.display = state.shown ? "none" : "block";

    var exhausted = state.shown >= state.total;
    $("morebar").style.display = exhausted ? "none" : "block";
    $("done").style.display = (state.shown && exhausted && !state.q) ? "block" : "none";
    if (!state.q && exhausted && state.shown){
      $("done").textContent = "— 已显示全部 " + state.shown + " 条 —";
    }
    // 标题要能反映当前筛选：搜索 > (分类 + 归档) > 最新
    var head = "最新资讯";
    if (state.q){
      head = "搜索「" + state.q + "」· " + state.shown + " 条";
    } else {
      var parts = [];
      if (state.cat) parts.push(catLabel(state.cat));
      if (state.date) parts.push(state.date + " 归档");
      head = parts.length ? (parts.join(" · ") + " · " + state.total + " 条") : "最新资讯";
    }
    $("feedTitle").textContent = head;
  }

  function reload(){
    state.page = 0;
    state.shown = 0;
    if (state.date && !ARCH[state.date]){
      $("feed").innerHTML = '<div class="done">加载归档…</div>';
      return loadJson("./archive/" + state.date + ".json").then(function(d){
        ARCH[state.date] = d.items || [];
        renderFeed(false);
      }).catch(function(e){
        $("feed").innerHTML = "";
        setStatus("该日归档读取失败（" + e.message + "）", true);
        $("empty").style.display = "block";
      });
    }
    renderFeed(false);
    return Promise.resolve();
  }

  /* ---------- 事件 ---------- */
  $("moreBtn").addEventListener("click", function(){ renderFeed(true); });

  $("reloadBtn").addEventListener("click", function(){
    var b = $("reloadBtn"); b.classList.add("spin");
    loadJson("./news.json").then(function(d){
      DATA = d; ARCH = {};
      renderChannels(); renderDays(); renderHot();
      return reload();
    }).then(function(){
      setStatus("资讯快照 · 构建于 " + (DATA.built_at_str || "?") +
                " · 共 " + (DATA.feed_total || 0) + " 条", false);
    }).catch(function(e){
      setStatus("快照读取失败（" + e.message + "）", true);
    }).then(function(){ b.classList.remove("spin"); });
  });

  function pickItem(pool, id){
    if (!id) return null;
    for (var i=0;i<pool.length;i++){
      if (String(pool[i].item_id) === String(id) ||
          String(pool[i].cluster_id) === String(id)) return pool[i];
    }
    return null;
  }
  $("feed").addEventListener("click", function(e){
    var c = e.target.closest ? e.target.closest(".card") : null;
    if (!c) return;
    var it = pickItem(currentItems(), c.getAttribute("data-id"));
    openArticle(it || { origin_url: c.getAttribute("data-orig") });
  });
  $("hotstrip").addEventListener("click", function(e){
    var c = e.target.closest ? e.target.closest(".hot") : null;
    if (!c) return;
    var it = pickItem((DATA.hot && DATA.hot.items) || [], c.getAttribute("data-id"));
    openArticle(it || { origin_url: c.getAttribute("data-orig") });
  });

  var qEl = $("q"), qTimer = null;
  qEl.addEventListener("input", function(){
    clearTimeout(qTimer);
    $("searchWrap").classList.toggle("hasval", !!qEl.value);
    qTimer = setTimeout(function(){
      state.q = qEl.value.trim();
      reload();
    }, 350);
  });
  $("clrBtn").addEventListener("click", function(){
    qEl.value = ""; state.q = ""; $("searchWrap").classList.remove("hasval"); reload(); qEl.focus();
  });
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape" && qEl.value){ $("clrBtn").click(); return; }
    var tag = (e.target.tagName || "").toLowerCase();
    if (e.key === "/" && tag !== "input" && tag !== "textarea"){ e.preventDefault(); qEl.focus(); }
  });

  /* ---------- 启动 ---------- */
  setStatus("正在读取资讯快照…", false);
  loadJson("./news.json").then(function(d){
    DATA = d;
    renderChannels(); renderDays(); renderHot();
    return reload();
  }).then(function(){
    setStatus("资讯快照 · 构建于 " + (DATA.built_at_str || "?") +
              " · 共 " + (DATA.feed_total || 0) + " 条", false);
    $("srcHint").textContent = "news.json";
  }).catch(function(e){
    setStatus("快照读取失败（" + e.message + "）", true);
    $("stats").textContent = "离线";
    $("empty").style.display = "block";
  });
})();
</script>
</body>
</html>
